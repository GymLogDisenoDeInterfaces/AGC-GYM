name: gym_components
description: Componentes visuales de agc-gym, el diario de entrenamiento manos libres. Incluye RepCounter (contador circular de repeticiones) y SetTile (fila de una serie).
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
